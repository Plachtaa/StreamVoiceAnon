[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamvoiceanonplus"
version = "0.2.0"
description = "StreamVoiceAnon and StreamVoiceAnon+ inference"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
sva = "streamvoiceanonplus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]

[tool.setuptools.package-data]
streamvoiceanonplus = ["resources/*.json", "resources/configs/*/*.yaml", "_native/*/UPSTREAM_LICENSE"]
